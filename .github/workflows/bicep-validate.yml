name: Bicep Lint & Plan (What-If)

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch: {}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Bicep lint (build catches syntax/type errors)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # what-if requires Azure credentials (OIDC federated login) stored as repo secrets:
      # AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
      # This step is skipped automatically if the secrets are not configured,
      # since provisioning the real infrastructure is optional for this exercise.
      - name: Azure login (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if (plan only, no resources created)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        run: |
          az deployment group what-if \
            -g ${{ vars.AZURE_RESOURCE_GROUP }} \
            -f infra/main.bicep \
            -p infra/main.bicepparam \
            -p sshPublicKey="${{ secrets.SSH_PUBLIC_KEY }}"
